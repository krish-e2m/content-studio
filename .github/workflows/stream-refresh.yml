# Daily stream refresh. Calls POST /api/cron/stream-refresh on the deployed API
# so every client's Stream tab gets fresh research topics once a day.
#
# Runs from GitHub instead of a timer inside the server because the Render free
# tier sleeps when idle, so an in-process schedule would never fire. This
# request is also what wakes it up.
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   API_URL      base URL of the deployed API, e.g. https://content-studio.onrender.com
#   CRON_SECRET  same value as CRON_SECRET in the server's environment
name: Daily stream refresh

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day (GitHub can start it a few minutes late)
  workflow_dispatch:
    inputs:
      clientId:
        description: 'Refresh one client only (leave blank for all clients)'
        required: false
        default: ''

# Never let a manual run overlap the scheduled one (double LLM spend).
concurrency:
  group: stream-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A sleeping Render instance takes up to a minute to boot. Wake it with the
      # cheap health check (safe to retry) so the POST below only goes out once.
      - name: Wake the API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 \
            "${API_URL%/}/api/health"

      - name: Refresh stream topics
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLIENT_ID: ${{ inputs.clientId }}
        run: |
          body='{}'
          if [ -n "$CLIENT_ID" ]; then
            body=$(jq -n --arg id "$CLIENT_ID" '{clientId: $id}')
          fi

          # Clients are refreshed one after another server-side, so this can
          # take a while with many clients.
          status=$(curl -sS --max-time 1500 -o result.json -w '%{http_code}' \
            -X POST "${API_URL%/}/api/cron/stream-refresh" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "$body")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then cat result.json; exit 1; fi

          jq '.totals, [.results[] | {name, ok, added, error}]' result.json
          # Fail the run (GitHub emails you) if any client errored.
          jq -e '.ok' result.json > /dev/null
