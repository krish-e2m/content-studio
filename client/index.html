<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Content Studio</title>
    <meta
      name="description"
      content="One calm place to plan, write, organize images and schedule content across every platform."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter across the whole product (400-700). Cormorant Garamond was dropped:
      as a display serif it was legible at 3rem but was also setting 14px table
      rows and document names, where its light stems and small x-height hurt
      readability. JetBrains Mono stays for genuinely monospace content only
      (raw JSON, log output, code, hex values).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
